# This GitHub workflow updates the name of the project.
name: Update initial project name

on:
  workflow_dispatch:
    inputs:
        project_name:
          description: 'Project Name'
          required: true
          default: PROJECT_NAME_CHANGE_ME
        new_project_name:
          description: 'New Project Name'
          required: true
          default: NEW_PROJECT_NAME

jobs:
  update-name:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.WORKFLOW_TOKEN }}
      - name: Change Project Name Filenames to Desired Name
        run: |
          sudo apt-get install -y rename
          find . -depth -iname "*${{ github.event.inputs.project_name }}*" -exec rename 's/${{ github.event.inputs.project_name }}/${{ github.event.inputs.new_project_name }}/' '{}' \;

      - name: Change Project Name within Files to Desired Name
        run: |
          find . -not -path '*/\.git/*' -type f -exec sed -i 's/${{ github.event.inputs.project_name }}/${{ github.event.inputs.new_project_name }}/g' '{}' \;
      - name: Commit Changes
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          git config --global user.name "Deploy CICD Bot"
          git config --global user.email "noreply-cicd-bot@imail.org"
          git checkout -b rename-project
          git add .github ${{ github.event.inputs.new_project_name }} docs cicd_params.json README.md
          git rm -r ${{ github.event.inputs.project_name }}
          git commit -m "Rename project to ${{ github.event.inputs.new_project_name }}"
          git push origin rename-project
      - name: Create Pull Request
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          gh pr create --base main --head rename-project --title "Rename project to ${{ github.event.inputs.new_project_name }}" --body "This PR was generated by the Update initial project name workflow."
  
