# This GitHub workflow deploys Bundle resources (ML resource config and more)
# defined under PROJECT_NAME_CHANGE_ME/resources/*
# and PROJECT_NAME_CHANGE_ME/databricks.yml with staging deployment target configs,
# when PRs are merged into the default branch
name: Bundle Deployment for PROJECT_NAME_CHANGE_ME Staging

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./PROJECT_NAME_CHANGE_ME

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  staging:
    environment: tst
    concurrency: PROJECT_NAME_CHANGE_ME-staging-bundle-job
    runs-on:
      group: ent-eip-prd-wus2
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.MI_CLIENT_ID }}
          tenant-id: ${{ secrets.MI_TENANT_ID }}
          subscription-id: ${{ secrets.MI_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@v0.236.0
      - name: Validate Bundle For Staging
        id: validate
        run: |
          databricks bundle validate -t staging
      - name: Deploy Bundle to Staging
        id: deploy
        run: |
          databricks bundle deploy -t staging
