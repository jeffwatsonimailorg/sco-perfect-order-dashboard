# This GitHub workflow validates Bundle config (ML resource config and more)
# defined under PROJECT_NAME_CHANGE_ME/resources/*
# and PROJECT_NAME_CHANGE_ME/databricks.yml, when PRs are merged into the main branch
name: Bundle validation for PROJECT_NAME_CHANGE_ME

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'PROJECT_NAME_CHANGE_ME/**'

defaults:
  run:
    working-directory: ./PROJECT_NAME_CHANGE_ME/

permissions:
  contents: read
  pull-requests: write
  id-token: write  

jobs:
  prod:
    environment: prd
    concurrency: PROJECT_NAME_CHANGE_ME-prod-bundle-job
    runs-on:
      group: ent-eip-prd-wus2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.MI_CLIENT_ID }}
          tenant-id: ${{ secrets.MI_TENANT_ID }}
          subscription-id: ${{ secrets.MI_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@v0.236.0
      - name: Validate Bundle For Prod
        id: validate          
        run: |
          databricks bundle validate -t prod > ../validate_output.txt
      - name: Create Comment with Bundle Configuration
        uses: actions/github-script@v7
        id: comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const fileContents = fs.readFileSync('validate_output.txt', 'utf8');
            const output = `#### Bundle Prod Config Validated 🖌
            <details><summary>Prod Validation Output</summary>

            \`\`\`\n
            ${fileContents}
            \`\`\`

            </details>`

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
