# This is a basic workflow to help you get started with GitHub Actions

name: Example Node.JS Workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events to the main branch
  # More info: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of public GitHub runner that the job will run on.
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4
    
    # Sets up a Node.js environment
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14' # Specify the Node.js version here

    # Runs a single command using the runners shell
    - name: Install dependencies
      run: npm install

    # Runs a set of commands using the runners shell
    - name: Run tests
      run: npm test
