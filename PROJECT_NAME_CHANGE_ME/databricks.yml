# The name of the bundle. run `databricks bundle schema` to see the full bundle settings schema.
bundle:
  name: PROJECT_NAME_CHANGE_ME

workspace:
  root_path: /Workspace/MLOps/bundles/${bundle.name}/envs/${bundle.target}

variables:
  experiment_name:
    description: Experiment name for the model training.
    default: /MLOps/experiments/${bundle.target}-PROJECT_NAME_CHANGE_ME-experiment
  model_name:
    description: Model name for the model training.
    default: PROJECT_NAME_CHANGE_ME-model
  catalog_name:
    description: The catalog name to save the trained model
  warehouse_id:
    description: The warehouse to use for SQL tasks
  manage_group_name:
    description: Name of MLOps manage group
    default: DPG_MLOP_SP_MANAGE_DEV

permissions:
  - level: CAN_VIEW
    group_name: users
  - level: CAN_MANAGE
    group_name: DP_DAP_MLOPS_USR

# Allow users to execute models in Unity Catalog
grants: &grants
  grants:
    - privileges:
        - EXECUTE
      principal: account users

# Defines model and experiments
resources:
  registered_models:
      model:
        name: ${var.model_name}
        catalog_name: ${var.catalog_name}
        schema_name: ds_output
        owner: ${var.manage_group_name}
        comment: Registered model in Unity Catalog for the "PROJECT_NAME_CHANGE_ME" ML Project for ${var.catalog_name} deployment target.
        <<: *grants

  experiments:
    experiment:
      name: ${var.experiment_name}
      # description: MLflow Experiment used to track runs for PROJECT_NAME_CHANGE_ME project.
    
include:
  # Resources folder contains ML artifact resources for the ML project that defines model and experiment
  # And workflows resources for the ML project including model training -> validation -> deployment,
  # feature engineering,  batch inference, quality monitoring, metric refresh, alerts and triggering retraining
  - ./resources/batch-inference-workflow-resource.yml
  - ./resources/model-workflow-resource.yml
  # TODO: uncomment once monitoring inference table has been created
  # - ./resources/monitoring-resource.yml
  # - ./resources/retraining-resource.yml

# Deployment Target specific values for workspace
targets:
  dev:  # UC Catalog Name 
    default: true
    variables:
      catalog_name: dev_datascience
      warehouse_id: 869aa2fdb363895d
      manage_group_name: DPG_MLOPS_SP_MANAGE_DEV
    workspace:
      host: https://adb-5918574733311837.17.azuredatabricks.net

  prod:
    variables:
      catalog_name: prod_datascience
      warehouse_id: f07ae593c1cbf0f1
      manage_group_name: DPG_MLOPS_SP_MANAGE_PRD
    workspace:
      host: https://adb-3199811121433763.3.azuredatabricks.net
    resources:
      jobs:
        batch_inference_job:
          schedule:
            quartz_cron_expression: "0 0 11 * * ?" # daily at 11am
            timezone_id: America/Denver
        model_training_job:
          schedule:
            quartz_cron_expression: "0 0 11 * * ?" # daily at 11am
            timezone_id: America/Denver
        # update_monitoring_table_job:
        #   schedule:
        #     quartz_cron_expression: "0 30 7 * * ?" # daily at 7:30 AM
        #     timezone_id: America/Denver
