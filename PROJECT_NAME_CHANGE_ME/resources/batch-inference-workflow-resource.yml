new_cluster: &new_cluster
  new_cluster:
    spark_version: 15.4.x-cpu-ml-scala2.12
    node_type_id: Standard_D4ds_v5
    driver_node_type_id: Standard_D4ds_v5
    autoscale:
      min_workers: 1
      max_workers: 8
    azure_attributes:
      availability: SPOT_WITH_FALLBACK
    data_security_mode: "SINGLE_USER"
    custom_tags:
      clusterSource: mlops-stacks_0.4
      Department: MLOps

resources:
  jobs:
    batch_inference_job:
      name: mlops_${bundle.target}-PROJECT_NAME_CHANGE_ME-batch-inference-job
      tasks:
        - task_key: batch_inference_job
          <<: *new_cluster
          notebook_task:
            notebook_path: ../deployment/batch_inference/notebooks/BatchInference.py
            base_parameters:
              env: ${bundle.target}
              input_table_name: ${bundle.target}_feature_store.ds_output.feature_store_inference_input  # TODO: create input table for inference
              output_table_name: ${bundle.target}_feature_store.ds_output.predictions
              model_name: ${var.catalog_name}.ds_output.${var.model_name}
              # git source information of current ML resource deployment. It will be persisted as part of the workflow run
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}

      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      email_notifications:
         on_failure:
          - mlops-support@imail.org
      tags:
        Department: MLOps
        model_name: ${bundle.name}
